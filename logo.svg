<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background radial gradient -->
        <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#260b3c" />
            <stop offset="100%" stop-color="#07010e" />
        </radialGradient>
        
        <!-- Text & icon linear gradient -->
        <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#bd00ff" />
            <stop offset="100%" stop-color="#00ff88" />
        </linearGradient>

        <!-- Folder glow filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="9" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6"/>
    
    <!-- Outer Explorer Window Outline -->
    <rect x="46" y="56" width="420" height="400" rx="38" fill="none" stroke="rgba(189, 0, 255, 0.18)" stroke-width="4" />
    <line x1="46" y1="120" x2="466" y2="120" stroke="rgba(189, 0, 255, 0.18)" stroke-width="3" />
    
    <!-- Window action dots -->
    <circle cx="85" cy="88" r="7" fill="#ff0055" opacity="0.8"/>
    <circle cx="112" cy="88" r="7" fill="#ffc107" opacity="0.8"/>
    <circle cx="139" cy="88" r="7" fill="#00ff88" opacity="0.8"/>

    <!-- Glowing Folder & Cloud Concept Icons -->
    <g filter="url(#glow)">
        <!-- Back Folder Wing (Purple) -->
        <path d="M 110 230 L 210 230 L 235 255 L 400 255 C 415 255 425 265 425 280 L 425 385 C 425 400 415 410 400 410 L 110 410 C 95 410 85 400 85 385 L 85 255 C 85 240 95 230 110 230 Z" fill="none" stroke="#bd00ff" stroke-width="12" stroke-linejoin="round" opacity="0.6"/>
        
        <!-- Front Folder Wing (Neon Green/Cyan) -->
        <path d="M 125 260 L 225 260 L 250 285 L 390 285 C 405 285 415 295 415 310 L 410 395 C 410 410 395 420 380 420 L 105 420 C 90 420 78 410 80 395 L 90 285 C 92 270 110 260 125 260 Z" fill="none" stroke="#00ff88" stroke-width="13" stroke-linejoin="round"/>

        <!-- Floating Explorer Nodes (Cloud linkage) -->
        <circle cx="340" cy="185" r="22" fill="#bd00ff" />
        <circle cx="270" cy="195" r="14" fill="#00ff88" />
        <line x1="284" y1="193" x2="318" y2="188" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    </g>
    
    <!-- Center Letters K (White) & E (Neon Gradient) -->
    <g filter="url(#glow)">
        <text x="175" y="375" font-family="'Outfit', sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="-3">K</text>
        <text x="250" y="375" font-family="'Outfit', sans-serif" font-weight="900" font-size="110" fill="url(#neonGrad)" letter-spacing="-3">E</text>
    </g>
</svg>
