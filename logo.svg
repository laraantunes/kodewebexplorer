<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background radial gradient -->
        <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#260b3c" />
            <stop offset="100%" stop-color="#07010e" />
        </radialGradient>
        
        <!-- Text & icon linear gradient -->
        <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#bd00ff" />
            <stop offset="100%" stop-color="#00ff88" />
        </linearGradient>

        <!-- Folder glow filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="9" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6"/>

    <!-- Glowing Folder & Cloud Concept Icons -->
    <g filter="url(#glow)">
        <!-- Back Folder Wing (Purple) -->
        <path d="M 110 130 L 210 130 L 235 155 L 400 155 C 415 155 425 165 425 180 L 425 385 C 425 400 415 410 400 410 L 110 410 C 95 410 85 400 85 385 L 85 155 C 85 140 95 130 110 130 Z" fill="none" stroke="#bd00ff" stroke-width="12" stroke-linejoin="round" opacity="0.6"/>
        
        <!-- Front Folder Wing (Neon Green/Cyan) -->
        <path d="M 125 160 L 225 160 L 250 185 L 390 185 C 405 185 415 195 415 210 L 410 395 C 410 410 395 420 380 420 L 105 420 C 90 420 78 410 80 395 L 90 185 C 92 170 110 160 125 160 Z" fill="none" stroke="#00ff88" stroke-width="13" stroke-linejoin="round"/>

    </g>
    
    <!-- Center Letters K (White) & E (Neon Gradient) -->
    <g filter="url(#glow)">
        <text x="180" y="325" font-family="'Outfit', sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="-3">K</text>
        <text x="255" y="325" font-family="'Outfit', sans-serif" font-weight="900" font-size="110" fill="url(#neonGrad)" letter-spacing="-3">E</text>
    </g>
</svg>
