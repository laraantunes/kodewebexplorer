version: '3.8'

services:
  kodeweb_explorer:
    build: .
    container_name: kodeweb_explorer_app
    ports:
      # Usando a porta 8082 para não conflitar com 8080 (IDE) e 8081 (Lite)
      - "8082:80"
    volumes:
      - ./data:/var/www/html/data
      # Defina KODEWEB_DOCKER_WORKSPACE_ROOT no seu arquivo .env (ex: KODEWEB_DOCKER_WORKSPACE_ROOT=C:\)
      - ${KODEWEB_DOCKER_WORKSPACE_ROOT:-./workspace}:/workspace
    restart: unless-stopped
